name: Build APK

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# 同一个分支/标签上并发跑时不互相覆盖产物；标签重推时取消旧的一次
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: 确保 gradlew 可执行（Windows 上提交容易丢掉执行位）
        run: chmod +x gradlew

      - name: 读取版本号（来自 app/build.gradle.kts）
        id: version
        run: |
          VERSION=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts | head -n1)
          CODE=$(sed -n 's/.*versionCode = \([0-9]*\).*/\1/p' app/build.gradle.kts | head -n1)
          if [ -z "$VERSION" ] || [ -z "$CODE" ]; then
            echo "::error::没能从 app/build.gradle.kts 里读到 versionName/versionCode"
            exit 1
          fi
          echo "版本: $VERSION ($CODE)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"

      - name: 安装 JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"

      - name: 安装 Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          # 注意平台包名带小版本号：android-37.0 / 36.1 这样（写成 android-37 会找不到包）
          packages: "platform-tools build-tools;36.0.0 platforms;android-37.0"

      - name: 接受 SDK 许可（供 AGP 自动补齐缺失组件）
        run: yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: 缓存 Gradle
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: 检查是否配置了正式签名
        id: signing
        env:
          KEY_B64: ${{ secrets.POCKET_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEY_B64" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "已配置正式签名 keystore"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "未配置正式签名：本次用 debug 签名（配合缓存的 debug keystore 保持覆盖安装兼容）"
          fi

      - name: 缓存 debug keystore（没配正式签名时，保证跨 run 覆盖安装签名一致）
        if: steps.signing.outputs.present != 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.android
          key: android-debug-keystore-v1

      - name: 配置正式签名（可选：配置了 secrets 就用正式 keystore）
        if: steps.signing.outputs.present == 'true'
        env:
          POCKET_KEYSTORE_BASE64: ${{ secrets.POCKET_KEYSTORE_BASE64 }}
        run: |
          echo "$POCKET_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/pocket.jks"
          echo "POCKET_KEYSTORE_PATH=$RUNNER_TEMP/pocket.jks" >> "$GITHUB_ENV"
          echo "POCKET_KEYSTORE_PASSWORD=${{ secrets.POCKET_KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
          echo "POCKET_KEY_ALIAS=${{ secrets.POCKET_KEY_ALIAS }}" >> "$GITHUB_ENV"
          echo "POCKET_KEY_PASSWORD=${{ secrets.POCKET_KEY_PASSWORD }}" >> "$GITHUB_ENV"

      - name: 安装 Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: 校验内置运行时（离线：与仓库里的 boot-runtime.json 比对）
        run: node tools/fetch-boot-runtime.mjs --check

      - name: 单元测试（解析 / 配置 / 状态 / 安全边界 / Markdown）
        run: ./gradlew :app:testDebugUnitTest --console=plain --no-daemon

      - name: 构建 Debug APK
        run: ./gradlew :app:assembleDebug --console=plain --no-daemon

      - name: 暂存 Debug 包
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/app-debug.apk \
             "artifacts/opencode-pocket-${{ steps.version.outputs.version }}-debug.apk"

      - name: 构建 Release APK（默认 debug 签名，便于直接安装体验）
        run: ./gradlew :app:assembleRelease --console=plain --no-daemon

      - name: 暂存标准包
        run: |
          cp app/build/outputs/apk/release/app-release.apk \
             "artifacts/opencode-pocket-${{ steps.version.outputs.version }}-arm64.apk"

      - name: 构建精简版 Release APK（R8 压缩，约 4 MB）
        run: ./gradlew :app:assembleRelease "-Ppocket.minify=true" --console=plain --no-daemon

      - name: 暂存精简包
        run: |
          cp app/build/outputs/apk/release/app-release.apk \
             "artifacts/opencode-pocket-${{ steps.version.outputs.version }}-arm64-slim.apk"
          ls -l artifacts

      - name: 打包自检（原生库字节一致 / ABI / 容器脚本 / manifest / dex / 版本号）
        run: |
          for apk in artifacts/*.apk; do
            node tools/verify-apk.mjs "$apk"
          done

      - name: 打印签名指纹
        run: |
          APK=$(ls artifacts/*-arm64.apk | head -n1)
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$APK" | grep -E "DN|SHA-256" | head -n4

      - name: 上传产物
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: opencode-pocket-apk
          path: artifacts/*.apk
          if-no-files-found: error

  # 容器配方冒烟：在 Linux/x86_64 上用 proot 把 rootfs / 脚本 / Node / opencode / 服务 API 全跑一遍。
  # 与 build 并行；tag 发布时它也是发布闸门（release needs 两个 job）。
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: 运行容器配方冒烟测试
        run: timeout 2400 bash tools/ci-runtime-smoke.sh

      - name: 冒烟失败时打印关键日志
        if: failure()
        run: |
          for f in .smoke/serve.log .smoke/web.log .smoke/apt.log .smoke/tools.log; do
            if [ -f "$f" ]; then
              echo "==== $f ===="
              tail -n 60 "$f"
            fi
          done

  release:
    needs: [build, smoke]
    # 只在推送 v* 标签时发布，且必须先构建与冒烟都成功
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 校验 tag 与 app/build.gradle.kts 的 versionName 一致
        run: |
          VERSION="${{ needs.build.outputs.version }}"
          TAG="${GITHUB_REF_NAME#v}"
          echo "tag=$TAG  versionName=$VERSION"
          if [ "$VERSION" != "$TAG" ]; then
            echo "::error::标签 v$TAG 与 versionName $VERSION 不一致：请先把 app/build.gradle.kts 的 versionCode/versionName 改好再打标签"
            exit 1
          fi

      - name: 校验版本比最新 Release 更新（防止发出降级包）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NEW="${{ needs.build.outputs.version }}"
          LATEST=$(gh release list -R "$GITHUB_REPOSITORY" --limit 1 --json tagName --jq '.[0].tagName // ""' 2>/dev/null || echo "")
          if [ -z "$LATEST" ]; then
            echo "还没有历史 Release，跳过单调性检查"
            exit 0
          fi
          PREV="${LATEST#v}"
          HIGHER=$(printf '%s\n%s\n' "$PREV" "$NEW" | sort -V | tail -n1)
          echo "最新已发布：$PREV，本次：$NEW"
          if [ "$HIGHER" != "$NEW" ] || [ "$PREV" = "$NEW" ]; then
            echo "::error::版本号没有递增（已发布 $PREV）：老用户会装不上（INSTALL_FAILED_VERSION_DOWNGRADE）"
            exit 1
          fi

      - name: 下载构建产物
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: opencode-pocket-apk
          path: artifacts

      - name: 计算 APK 摘要（随 Release 一起发布）
        run: |
          sha256sum artifacts/*.apk | sed 's#artifacts/##' | tee SHA256SUMS.txt

      - name: 发布 Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            artifacts/*.apk
            SHA256SUMS.txt
          generate_release_notes: true
          body: |
            ## 安装

            手机需要 **arm64**、Android **11（API 30）及以上**。下载对应 APK 直接安装（需允许"未知来源"）。

            | 文件 | 大小 | 说明 |
            | --- | --- | --- |
            | `*-arm64.apk` | 约 28 MB | **推荐**，未混淆，最稳 |
            | `*-arm64-slim.apk` | 约 4 MB | R8 精简版，体积小，建议真机回归一次 |
            | `*-debug.apk` | 约 37 MB | 调试版，堆栈最全 |

            校验（可选）：下载附件里的 `SHA256SUMS.txt`，与本机 `sha256sum` 结果比对。

            ## 首次使用

            1. 打开 App → 安装页点「一键安装」（保持前台，约 5 分钟）
            2. 设置 → 模型与密钥，填一个 API Key，点「保存并重启服务」
            3. 首页「启动服务」→ 开「对话」或「打开网页」

            更多说明见 [README](https://github.com/${{ github.repository }}#readme)。
