name: Build APK

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: 确保 gradlew 可执行（Windows 上提交容易丢掉执行位）
        run: chmod +x gradlew

      - name: 安装 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: 安装 Android SDK
        uses: android-actions/setup-android@v3
        with:
          # 注意平台包名带小版本号：android-37.0 / 36.1 这样（写成 android-37 会找不到包）
          packages: "platform-tools build-tools;36.0.0 platforms;android-37.0"

      - name: 接受 SDK 许可（供 AGP 自动补齐缺失组件）
        run: yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: 缓存 Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 拉取内置 proot 运行时（Termux 官方 aarch64 包）
        run: node tools/fetch-boot-runtime.mjs

      - name: 校验内置运行时与远端一致
        run: node tools/fetch-boot-runtime.mjs --check

      - name: 单元测试（解析 / 配置 / 版本 / Markdown）
        run: ./gradlew :app:testDebugUnitTest --console=plain --no-daemon

      - name: 构建 Debug APK
        run: ./gradlew :app:assembleDebug --console=plain --no-daemon

      - name: 构建 Release APK（默认 debug 签名，便于直接安装体验）
        run: ./gradlew :app:assembleRelease --console=plain --no-daemon

      - name: 构建精简版 Release APK（R8 压缩，约 4 MB）
        run: ./gradlew :app:assembleRelease "-Ppocket.minify=true" --console=plain --no-daemon

      - name: 打包自检（内置运行时字节一致 / ABI / 容器脚本）
        run: |
          node tools/verify-apk.mjs app/build/outputs/apk/debug/app-debug.apk
          node tools/verify-apk.mjs app/build/outputs/apk/release/app-release.apk

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: opencode-pocket-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error
